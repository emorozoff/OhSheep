<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>OhSheep — считай овец перед сном</title>
<meta name="description" content="Считай овец перед сном. Овца прыгает, ты вводишь её номер. Ошибся — овца вздыхает.">
<meta name="theme-color" content="#05597f">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
<link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="OhSheep">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preload" as="image" href="./assets/bg.webp">
<link rel="preload" as="image" href="./assets/sheep-stand.webp">
<link rel="preload" as="image" href="./assets/sheep-jump.webp">
<link rel="preload" as="image" href="./assets/sheep-sigh.webp">
<link rel="stylesheet" href="./src/styles.css">
</head>
<body>

<div class="room">
  <div class="phone">
    <div class="phone__speaker"></div>

    <div class="screen" id="screen">

      <!-- фон: настоящая картинка сцены -->
      <img class="bg" src="./assets/bg.webp" alt="" aria-hidden="true" draggable="false">

      <!-- лёгкое свечение экрана -->
      <div class="glow" aria-hidden="true"></div>

      <p class="sr-only" id="live" role="status" aria-live="polite"></p>

      <!-- меню -->
      <button class="menu" id="menuBtn" aria-label="Меню" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>

      <!-- сцена с овцой -->
      <div class="stage" id="stage"></div>

      <!-- ввод -->
      <div class="controls">
        <button class="entry" id="entry" type="button" aria-label="Введи номер овцы">
          <span class="entry__hint" id="entryHint" aria-hidden="true"></span>
          <span class="entry__text" id="entryText"></span><span class="caret" id="caret"></span>
        </button>

        <div class="keypad" id="keypad">
          <button class="key" type="button" data-d="1">1</button>
          <button class="key" type="button" data-d="2">2</button>
          <button class="key" type="button" data-d="3">3</button>
          <button class="key" type="button" data-d="4">4</button>
          <button class="key" type="button" data-d="5">5</button>
          <button class="key" type="button" data-d="6">6</button>
          <button class="key" type="button" data-d="7">7</button>
          <button class="key" type="button" data-d="8">8</button>
          <button class="key" type="button" data-d="9">9</button>

          <button class="key key--del" type="button" data-act="del" aria-label="Стереть">
            <svg viewBox="0 0 100 76" aria-hidden="true">
              <path d="M34 6 H86 Q94 6 94 14 V62 Q94 70 86 70 H34 L8 42 Q4 38 8 34 Z"
                    fill="#ffa1ab" stroke="#1c1c1e" stroke-width="5" stroke-linejoin="round"/>
              <path d="M46 26 L70 50 M70 26 L46 50" stroke="#231d1e" stroke-width="7" stroke-linecap="round"/>
            </svg>
          </button>
          <button class="key" type="button" data-d="0">0</button>
          <button class="key key--ok" type="button" data-act="ok" aria-label="Готово">
            <svg viewBox="0 0 100 76" aria-hidden="true">
              <ellipse cx="50" cy="38" rx="46" ry="34" fill="#40e2e4" stroke="#1c1c1e" stroke-width="5"/>
              <path d="M26 38 H70 M54 22 L74 38 L54 54" fill="none" stroke="#173d3f" stroke-width="7"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- меню-панель -->
      <div class="sheet" id="sheet" hidden>
        <div class="sheet__scrim" id="sheetScrim"></div>
        <div class="sheet__panel" role="dialog" aria-modal="true" aria-label="Настройки">
          <div class="sheet__grip"></div>
          <h2 class="sheet__title">Настройки. Зачем-то.</h2>

          <div class="stat">
            <div class="stat__cell"><b id="statNow">0</b><span>овец сегодня</span></div>
            <div class="stat__cell"><b id="statBest">0</b><span>рекорд</span></div>
            <div class="stat__cell"><b id="statNights">0</b><span>таких ночей</span></div>
          </div>

          <button class="row" type="button" id="tglSound" aria-pressed="true">
            <span>Звук «мееее»</span><i class="sw"></i>
          </button>
          <button class="row" type="button" id="tglCrickets" aria-pressed="true">
            <span>Сверчки</span><i class="sw"></i>
          </button>
          <button class="row" type="button" id="tglHaptics" aria-pressed="true">
            <span>Вибрация</span><i class="sw"></i>
          </button>
          <button class="row row--danger" type="button" id="btnReset">
            <span>Обнулить овец</span>
          </button>

          <p class="about">Версия для газорпазорпов ещё в разработке.</p>
          <button class="sheet__close" type="button" id="sheetClose">Ладно</button>
        </div>
      </div>

      <!-- сплэш -->
      <div class="splash" id="splash" aria-hidden="true">
        <img src="./assets/splash.webp" alt="OhSheep by emorozoff от скуки" draggable="false">
      </div>

    </div>

    <div class="phone__home"></div>
  </div>
</div>

<script type="module" src="./src/app.js"></script>
</body>
</html>
